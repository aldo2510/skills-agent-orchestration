name: Step 3

on:
  push:
    paths:
      - 'docs/design-handoff.md'
      - 'docs/coding-handoff.md'
      - 'docs/validation-report.md'
      - 'docs/final-handoff.md'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

env:
  STEP_FILE: ".github/steps/4-step.md"

jobs:
  find_exercise:
    uses: skills/exercise-toolkit/.github/workflows/find-exercise-issue.yml@v0.9.1

  check:
    needs: [find_exercise]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: test -f docs/design-handoff.md
      - run: test -f docs/coding-handoff.md
      - run: test -f docs/validation-report.md
      - run: test -f docs/final-handoff.md
      - run: test -f app/index.html
      - run: test -f app/styles.css
      - run: test -f app/project-data.json

  next:
    needs: [find_exercise, check]
    runs-on: ubuntu-latest
    env:
      ISSUE_REPOSITORY: ${{ github.repository }}
      ISSUE_NUMBER: ${{ needs.find_exercise.outputs.issue-number }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: skills/exercise-toolkit
          path: exercise-toolkit
          ref: v0.9.1
      - uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: exercise-toolkit/markdown-templates/step-feedback/step-finished-prepare-next-step.md
          vars: |
            next_step_number: 4
      - uses: GrantBirki/comment@v2.1.1
        with:
          repository: ${{ env.ISSUE_REPOSITORY }}
          issue-number: ${{ env.ISSUE_NUMBER }}
          file: ${{ env.STEP_FILE }}
